name: Build & Release Desktop Application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Desktop Application Icons
        run: npm run generate:icons

      - name: Build Next.js Static Export & Compile Electron
        env:
          NEXT_PUBLIC_API_URL: https://hrms-pany.onrender.com/api
          NEXT_PUBLIC_BACKEND_URL: https://hrms-pany.onrender.com
        run: npm run desktop:build

      - name: Package Windows Desktop Binaries (.exe & Portable)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --config electron-builder.json

      - name: Package macOS Desktop Binaries (.dmg & .zip)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --config electron-builder.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.os }}
          path: |
            frontend/dist/*.exe
            frontend/dist/*.dmg
            frontend/dist/*.zip
          retention-days: 7

      - name: Publish Binaries to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            frontend/dist/*.exe
            frontend/dist/*.dmg
            frontend/dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
